# SPDX-License-Identifier: AGPL-3.0-or-later
name: Security audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly Monday 06:00 UTC: catches new RustSec / npm advisories without PR noise.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-audit:
    name: Rust (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.93.0'

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.6 --locked

      # Advisories (RustSec) + bans + licenses + sources, all from deny.toml.
      # Fails on warnings so new advisories break CI loudly.
      - name: Check Rust dependencies
        run: cargo deny --locked check advisories bans licenses sources -D warnings

  pnpm-audit:
    name: JS (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # High+critical only: moderate/low churn would desensitize the signal.
      # `pnpm audit` exits non-zero when matching advisories exist.
      - name: Audit pnpm lockfiles
        run: pnpm audit --audit-level high
